{% set name = "pygments-lexer-solidity" %}
{% set version = "0.7.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pygments-lexer-solidity-{{ version }}.tar.gz
  sha256: a347fd96981838331b6d98b0f891776908a49406d343ff2a40a6a1c8475a9350

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - pygments >=2.1
    - python >={{ python_min }},<4.0

test:
  imports:
    - pygments_lexer_solidity
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.com/veox/pygments-lexer-solidity
  summary: Solidity lexer for Pygments (includes Yul intermediate language)
  license: BSD-2-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - spinoch
